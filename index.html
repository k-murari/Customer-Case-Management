<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Character encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Responsive design -->
    <title>My First Webpage</title>
    <!-- Page title -->
    <style>
      /* Basic styling */
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f9f9f9;
      }
      h1 {
        color: #333;
      }
      p {
        color: #555;
      }
      img {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <!-- Main heading -->
    <h1>Welcome to My Webpage</h1>

    <!-- Paragraph -->
    <p>
      This is a simple HTML page created as an example. You can add more
      content, images, and links to make it more interesting.
    </p>

    <!-- Image -->
    <img src="https://via.placeholder.com/400" alt="Sample Image" />

    <!-- Link -->
    <p>
      Visit
      <a href="https://www.example.com" target="_blank">Example Website</a> for
      more information.
    </p>
  </body>
</html>
